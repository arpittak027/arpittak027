name: Refresh animated profile cards
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install font subsetter and fetch Inter
        run: |
          python -m pip install --upgrade pip fonttools brotli
          mkdir -p assets/fonts data
          curl -L --fail --silent --show-error "https://raw.githubusercontent.com/google/fonts/main/ofl/inter/Inter%5Bopsz%2Cwght%5D.ttf" -o "assets/fonts/Inter[opsz,wght].ttf"
      - name: Refresh contribution calendar JSON
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api graphql -f query='query { user(login: "arpittak027") { contributionsCollection { contributionCalendar { totalContributions weeks { contributionDays { date contributionCount } } } } } }' > data/contributions.json
      - name: Render SVG cards
        run: python scripts/render_cards.py
      - name: Commit generated cards and data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*.svg data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated GitHub profile cards"
            git push
          fi
