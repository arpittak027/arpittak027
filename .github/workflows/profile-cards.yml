name: Refresh animated profile cards

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p data
          gh api graphql -f query='query {
            user(login: "arpittak027") {
              contributionsCollection {
                contributionCalendar {
                  totalContributions
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                      color
                    }
                  }
                }
              }
            }
          }' > data/contributions.json

      - name: Render animated SVG cards
        run: python scripts/render_readme_cards.py

      - name: Validate SVG XML
        run: python -c "import glob, xml.etree.ElementTree as ET; [ET.parse(p) for p in glob.glob('cards/*.svg')]; print('All SVGs validated successfully.')"

      - name: Commit & push updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/*.svg data/contributions.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh animated profile cards [skip ci]"
            git push
          else
            echo "No changes detected in cards or contribution data."
          fi
