<?xml version="1.0" encoding="UTF-8"?>
      <svg width="600" height="300" viewBox="0 0 600 300" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <!-- Premium Gradients -->
          <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#282a36" /> 
            <stop offset="100%" stop-color="#44475a" /> 
          </linearGradient>

          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#bd93f9" stop-opacity="0.3" />
            <stop offset="100%" stop-color="#bd93f9" stop-opacity="0" />
          </radialGradient>
          
          <linearGradient id="cardGradient" x1="0" y1="0" x2="600" y2="300" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="white" stop-opacity="0.1"/>
            <stop offset="1" stop-color="white" stop-opacity="0.02"/>
          </linearGradient>

          <linearGradient id="hpLog" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ff5555" />
            <stop offset="100%" stop-color="#ff6e6e" />
          </linearGradient>
          
          <linearGradient id="xpLog" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#8be9fd" />
            <stop offset="100%" stop-color="#a4ffff" />
          </linearGradient>

          <!-- Glassmorphism Blur & Shadow -->
          <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur in="SourceGraphic" stdDeviation="5"/>
          </filter>

          <filter id="dropshadow">
            <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="black" flood-opacity="0.3"/>
          </filter>
        </defs>

        <style>
          .text-base { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
          .title { font-size: 24px; font-weight: 800; fill: #f8f8f2; letter-spacing: 0.5px; }
          .subtitle { font-size: 14px; font-weight: 500; fill: #6272a4; opacity: 0.8; }
          .label { font-size: 11px; font-weight: 700; fill: #bd93f9; letter-spacing: 1px; text-transform: uppercase; }
          .value { font-size: 12px; font-weight: 700; fill: #f8f8f2; }
          
          /* Animations */
          @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
          }
          @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.05); }
          }
          @keyframes shimmer {
             0% { opacity: 0.5; }
             50% { opacity: 1; }
             100% { opacity: 0.5; }
          }

          .pet-anim { animation: float 6s ease-in-out infinite; transform-origin: center; }
          .glow-anim { animation: pulse 4s ease-in-out infinite; transform-origin: center; }
          .bar-anim { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
          
          .glass-card {
            fill: url(#cardGradient);
            stroke: rgba(189, 147, 249, 0.3);
            stroke-width: 1px;
            rx: 16px;
          }
        </style>
        
        <!-- Main Card Container -->
        <rect x="0" y="0" width="600" height="300" rx="16" fill="url(#bgGradient)" />
        
        <!-- Ambient Glow Background -->
        <circle cx="120" cy="150" r="120" fill="url(#glow)" class="glow-anim" />
        
        <!-- Glass Overlay -->
        <rect x="1" y="1" width="598" height="298" class="glass-card" />

        <!-- LEFT SIDE: Content -->
        <g transform="translate(30, 30)">
           <!-- Title Block -->
           <text x="0" y="24" class="text-base title">Codezilla</text>
           <text x="0" y="46" class="text-base subtitle">Lvl 5 • Dragon</text>
           
           <!-- Info Badges (Mood & Streak) -->
           <g transform="translate(0, 70)">
             <!-- Mood Badge -->
             <rect x="0" y="0" width="120" height="32" rx="16" fill="rgba(0,0,0,0.2)" stroke="rgba(189, 147, 249, 0.3)" stroke-width="1"/>
             <text x="60" y="21" text-anchor="middle" class="text-base value" fill="#f8f8f2">
               😡 ANGRY
             </text>
             
             <!-- Streak Badge -->
             <g transform="translate(130, 0)">
                <rect x="0" y="0" width="150" height="32" rx="16" fill="rgba(0,0,0,0.2)" stroke="rgba(189, 147, 249, 0.3)" stroke-width="1"/>
                <text x="75" y="21" text-anchor="middle" class="text-base value" fill="#f8f8f2">
                   🔥 0 DAY STREAK
                </text>
             </g>
           </g>

           <!-- Stats Bars -->
           <g transform="translate(0, 130)">
             <!-- HP -->
             <g>
               <text x="0" y="0" class="text-base label">Health 0%</text>
               <rect x="0" y="10" width="220" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
               <rect x="0" y="10" width="0" height="8" rx="4" fill="url(#hpLog)" class="bar-anim" />
               <!-- Shine/Glow on Bar -->
               <rect x="0" y="10" width="0" height="8" rx="4" fill="white" opacity="0.1" />
             </g>
             
             <!-- XP -->
             <g transform="translate(0, 45)">
               <text x="0" y="0" class="text-base label">XP 0 / 5000</text>
               <rect x="0" y="10" width="220" height="8" rx="4" fill="rgba(255,255,255,0.1)" />
               <rect x="0" y="10" width="220" height="8" rx="4" fill="url(#xpLog)" class="bar-anim" />
               <rect x="0" y="10" width="220" height="8" rx="4" fill="white" opacity="0.1" />
             </g>
           </g>
           
           <!-- Footer -->
           <text x="0" y="260" class="text-base subtitle" font-size="12">Last fed: 8/29/2026</text>
        </g>

        <!-- RIGHT SIDE: Pet Spotlight -->
        <g transform="translate(350, 50)">
           <!-- Platform -->
           <ellipse cx="100" cy="180" rx="90" ry="20" fill="rgba(0,0,0,0.3)" filter="url(#glass)" />
           
           <!-- Pet Sprite -->
           <g class="pet-anim">
             
      <!-- Ghost -->
      <defs>
        <radialGradient id="ghostGrad" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:#ffffff" />
          <stop offset="100%" style="stop-color:#cfd8dc" />
        </radialGradient>
      </defs>
      <g transform="translate(100, 100) scale(2.0)" opacity="0.7">
        <!-- Body -->
        <path d="M-25,30 Q-25,-40 0,-40 Q25,-40 25,30 Q15,10 0,30 Q-15,10 -25,30" fill="url(#ghostGrad)" stroke="#90a4ae" stroke-width="1.5"/>
        
        <!-- Eyes -->
        <circle cx="-8" cy="-10" r="3" fill="#37474f"/>
        <circle cx="8" cy="-10" r="3" fill="#37474f"/>
        
        <!-- Mouth -->
        <circle cx="0" cy="5" r="4" fill="none" stroke="#37474f" stroke-width="1.5"/>
        
        <!-- Halo -->
        <ellipse cx="0" cy="-55" rx="15" ry="3" fill="none" stroke="#ffd700" stroke-width="2"/>
      </g>
    
           </g>
        </g>
        
      </svg>
    